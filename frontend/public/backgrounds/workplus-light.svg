      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 180) rotate(52) scale(420 580)">
      <stop stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
